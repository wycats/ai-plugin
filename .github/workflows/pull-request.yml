name: Validation and Site Deployment

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'marketplace.json'

permissions:
  contents: read

# Keep a production build and its deployment together as main advances.
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate canonical sources
        run: pnpm validate

      - name: Typecheck, lint, and test
        run: pnpm check

      - name: Build and check the reading site
        run: |
          pnpm test:site
          pnpm build:site
          pnpm check:site

      - name: Build VS Code projection
        run: pnpm build -- --config config.example.json

      - name: Build Claude Code projection
        run: pnpm build -- --config config.claude-code.example.json

      - name: Build Codex projection
        run: pnpm build -- --config config.codex.example.json

      - name: Build Pi projection
        run: pnpm build:pi

      - name: Verify Pi install and update against a local remote
        if: runner.os == 'Linux'
        run: |
          npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
          PI_TEST_BINARY="$(command -v pi)" pnpm test:pi-publication

      - name: Save the validated site for deployment
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: reading-site
          path: out/reading-site/
          if-no-files-found: error
          retention-days: 7

  deploy-site:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: reading-site-production
      url: https://ai.wycats.fun
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: reading-site
          path: out/reading-site

      - name: Install Vercel CLI
        run: npm install --global vercel@60.0.0

      - name: Deploy the validated site
        env:
          VERCEL_TOKEN: ${{ secrets.READING_SITE_VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_SMTCNO0JzmmzaOM4TXjwy3BiqLa5
          VERCEL_ORG_ID: team_1A5hxCsAnX5KFLm69oklRZWB
        run: vercel deploy out/reading-site --prod --yes --project "$VERCEL_PROJECT_ID" --scope yehuda-katzs-projects --token "$VERCEL_TOKEN"
