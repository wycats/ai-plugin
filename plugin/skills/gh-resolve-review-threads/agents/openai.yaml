interface:
  display_name: gh-resolve-review-threads
  short_description: Use when PR review or diff comments are supplied as
    actionable feedback to implement, including UI flows that send comments
    without an explicit typed request. Completing this work includes verifying
    the fix and resolving matching GitHub/Copilot review threads;
    observation-only requests should leave threads open.
policy:
  allow_implicit_invocation: true
