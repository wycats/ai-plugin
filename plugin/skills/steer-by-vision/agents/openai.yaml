interface:
  display_name: steer-by-vision
  short_description: Reorient a project by recovering its durable thesis and
    experienced outcome, reading live plans/tasks/PRs/substrate as candidate
    bets, and selecting one smallest meaningful end-to-end move with organic
    proof. Use when the user asks to steer or prioritize by vision, several
    technically valid gates compete without an active bet, an active bet's named
    steering signal has arrived, a closed milestone leaves no current bet, the
    user revises project purpose or outcome, or useful local work has lost its
    relationship to the project experience.
policy:
  allow_implicit_invocation: true
